name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag name (e.g. v4.0.0)
        required: true
        type: string
        default: v4.0.0
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Manager artifacts
        uses: actions/download-artifact@v8
        with:
          path: manager
          name: "Manager-release"
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            IS_PRE="${{ inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *-rc* || "$TAG" == *-beta* || "$TAG" == *-alpha* ]]; then
              IS_PRE="true"
            else
              IS_PRE="false"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IS_PRE=$IS_PRE" >> "$GITHUB_OUTPUT"

          python3 - "$TAG" << 'PY' > manager/update-meta.json
          import hashlib, json, re, subprocess, sys

          tag = sys.argv[1]
          commit_count = int(subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip())
          version_code = 30000 + commit_count + 700

          def tree_hash(*paths):
              oids = []
              for p in paths:
                  oid = subprocess.check_output(["git", "rev-parse", f"HEAD:{p}"], text=True).strip()
                  oids.append(oid)
              return hashlib.sha256(":".join(oids).encode()).hexdigest()[:8]

          uapi_text = open("uapi/supercall.h", encoding="utf-8").read()
          m = re.search(r"KERNEL_SU_UAPI_VERSION\s*=\s*(\d+)", uapi_text)
          uapi_ver = int(m.group(1)) if m else 1

          meta = {
              "versionCode": version_code,
              "versionName": tag,
              "lkmHash": tree_hash("kernel", "uapi"),
              "userspaceHash": tree_hash("userspace/ksud", "susfs-lkm", "external/nomount", "external/BuiltZygisk", "external/noshot"),
              "uapiVersion": uapi_ver,
          }
          print(json.dumps(meta, indent=2))
          PY
          cat manager/update-meta.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: UranXSU ${{ steps.meta.outputs.TAG }}
          prerelease: ${{ steps.meta.outputs.IS_PRE == 'true' }}
          generate_release_notes: true
          files: |
            manager/*.apk
            manager/update-meta.json
